name: 'Publish application'
on: 
  push:
    branches:
      - master

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    
    env:
      PUBLISH_FOLDER: publish/wwwroot

    steps:
      - name: Set the name of the repo in env variable 
        run: echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV
        
      - uses: actions/checkout@v2
      
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            9.x
            10.x
   
      # Tests target net9.0 (runtime 9.x above). A failing test stops the deployment.
      - name: Dotnet Test
        run: dotnet test Blazor.WinOld.Tests -c Release

      - name: Dotnet Publish
        run: dotnet publish -c Release -f net9.0 -o publish

      # static/dist (CSS + JS for non-Blazor sites) is regenerated by the build:
      # it must be committed in sync with the components' CSS.
      - name: Check static/dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- static/dist)" ]; then
            git status --short -- static/dist
            echo "::error::static/dist is out of date. Build the solution locally and commit the static/dist folder."
            exit 1
          fi

      - name: Change base-tag in index.html to repo name
        run: sed -i 's/<base href="\/" \/>/<base href="\/${{ env.REPO_NAME }}\/" \/>/g' $PUBLISH_FOLDER/index.html
  
      - name: copy index.html to 404.html
        run: cp $PUBLISH_FOLDER/index.html $PUBLISH_FOLDER/404.html
      
      - name: Add .nojekyll file
        run: touch $PUBLISH_FOLDER/.nojekyll
        
      - name: Deploy GitHub Pages action
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v3.6.1
        with:
            github_token: ${{ secrets.PUBLISH_TOKEN }}
            publish_branch: gh-pages
            publish_dir: ${{ env.PUBLISH_FOLDER }}
            allow_empty_commit: false
            keep_files: false
            force_orphan: true
